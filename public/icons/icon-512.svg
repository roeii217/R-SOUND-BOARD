<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e111b"/>
      <stop offset="50%" stop-color="#141829"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#neonGlow)" stroke-width="6" opacity="0.4"/>

  <!-- Glowing outer circular pulse -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#neonGlow)" stroke-width="4" opacity="0.3" stroke-dasharray="12 12"/>

  <!-- Sound wave equalizer bars -->
  <g filter="url(#glow)">
    <!-- Bar 1 -->
    <rect x="136" y="210" width="28" height="92" rx="14" fill="url(#neonGlow)"/>
    <!-- Bar 2 -->
    <rect x="184" y="150" width="28" height="212" rx="14" fill="url(#neonGlow)"/>
    <!-- Center Bar 3 (Tallest) -->
    <rect x="242" y="110" width="28" height="292" rx="14" fill="url(#neonGlow)"/>
    <!-- Bar 4 -->
    <rect x="300" y="170" width="28" height="172" rx="14" fill="url(#neonGlow)"/>
    <!-- Bar 5 -->
    <rect x="348" y="230" width="28" height="52" rx="14" fill="url(#neonGlow)"/>
  </g>

  <!-- Center tactile dot -->
  <circle cx="256" cy="256" r="6" fill="#ffffff" opacity="0.9"/>
</svg>
